# File to be located in home assistant 'config/packages' folder.
#
# The control parameters (slope, shift, kp...) are set with the
# heat_curve_climate number entities of the ESP (see boiler.yaml).
#
automation:
  
  - alias: Boiler Mode
    id: "d87edaba-fb6e-4639-ad52-9376c7b33e63"
    description: ""
    mode: single
    triggers:
      - trigger: state
        entity_id: climate.chaudiere_frisquet
        attribute: temperature
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: climate.chaudiere_frisquet
                attribute: temperature
                below: "7.2"
            sequence:
              - action: esphome.boiler_set_boiler_mode
                data:
                  mode: 4
          - conditions:
              - condition: numeric_state
                entity_id: climate.chaudiere_frisquet
                attribute: temperature
                above: "7.2"
                below: "17.2"
            sequence:
              - action: esphome.boiler_set_boiler_mode
                data:
                  mode: 0
          - conditions:
              - condition: numeric_state
                entity_id: climate.chaudiere_frisquet
                attribute: temperature
                above: "17"
            sequence:
              - action: esphome.boiler_set_boiler_mode
                data:
                  mode: 3
