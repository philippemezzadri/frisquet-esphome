name: Prepare release

# Run manually (Actions > Prepare release > Run workflow) before tagging.
# Adds the CHANGELOG.md section for the new version and opens a PR to dev,
# so that the tag created afterwards on main already contains its changelog.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.5.14"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update CHANGELOG and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0 # full history and tags are needed by git-cliff

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install git-cliff
        run: pip install git-cliff==2.13.1

      - name: Update CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/update_changelog.sh "$VERSION"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "docs: update CHANGELOG for v${version}"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "docs: update CHANGELOG for v${version}" \
            --body "Changelog section for v${version}, generated by git-cliff. Review and edit it if needed, then merge.

          Next steps: merge dev into main, then create the tag \`v${version}\` on main. The GitHub release is created automatically from this section.

          Note: CI does not run on pull requests opened by GitHub Actions; this PR only changes CHANGELOG.md."
